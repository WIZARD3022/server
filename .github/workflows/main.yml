name: Deploy UniKart Server

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # 2. Deploy changed/new files
      - name: Deploy to VPS
        run: |
          rsync -avz \
            --exclude ".env" \
            --exclude "uploads/" \
            --exclude "node_modules/" \
            --exclude ".git/" \
            --exclude "*.log" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.VPS_PORT }}" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/Desktop/vinit/server/

      # 3. Install dependencies and restart server
      - name: Restart PM2
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/Desktop/vinit/server && npm install --production && pm2 restart my-app"
