# UniKart Nginx Configuration
# Place this file in /etc/nginx/sites-available/unikart and symlink to /etc/nginx/sites-enabled/

# 1. API Reverse Proxy Server (api.uni-kart.in)
server {
    listen 80;
    server_name api.uni-kart.in;

    client_max_body_size 50M;

    # COOP/CORP headers to allow cross-origin requests & Google Login popups
    add_header 'Access-Control-Allow-Origin' '$http_origin' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Cross-Origin-Opener-Policy' 'unsafe-none' always;
    add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Web Frontend SPA Server (web.uni-kart.in)
server {
    listen 80;
    server_name web.uni-kart.in;

    root /var/www/unikart/build/web;
    index index.html;

    client_max_body_size 50M;

    # Allow Google OAuth Popups on Web Frontend
    add_header 'Cross-Origin-Opener-Policy' 'same-origin-allow-popups' always;
    add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /uploads/ {
        alias /var/www/unikart/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header 'Access-Control-Allow-Origin' '*' always;
    }
}
